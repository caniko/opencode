name: test

on:
  push:
    branches:
      - dev
      - v2
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Fixed diagnostic selection; only all qualifies the full suite
        type: choice
        default: all
        options:
          - all
          - timeline-history
          - timeline-benchmark
          - cli-startup
          - npm-git
          - composer
          - pty
          - app-config
          - vcs
          - shell-powershell
          - runtime-boundaries
      startup_preload:
        description: Child preload comparison for cli-startup diagnostics only
        type: choice
        default: configured
        options:
          - configured
          - none

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}-{2}-{3}', github.workflow, github.event.pull_request.number || github.ref, inputs.suite || 'all', inputs.startup_preload || 'configured')) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  affected:
    name: affected packages
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["cli-startup", "npm-git", "pty", "app-config", "vcs", "shell-powershell", "runtime-boundaries"]'), inputs.suite)
    # Keep upstream's pool while allowing the maintained fork to qualify on GitHub.
    runs-on: ${{ github.repository == 'caniko/opencode' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    outputs:
      app: ${{ steps.packages.outputs.app }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Find affected packages
        id: packages
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun x turbo@2.10.2 ls --affected --filter=@opencode/app --output=json > affected.json
          bun -e 'const result = await Bun.file("affected.json").json(); console.log("app=" + (result.packages.count > 0))' >> "$GITHUB_OUTPUT"

  unit:
    name: unit (${{ matrix.group == 'all' && matrix.settings.name || format('{0}, {1}', matrix.settings.name, matrix.group) }})
    if: github.event_name != 'workflow_dispatch' || !contains(fromJSON('["timeline-history", "timeline-benchmark", "composer"]'), inputs.suite)
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Serial full-suite Windows execution exceeds one step's budget.
        # Distribute the suites while retaining every assertion and the 20-minute limit.
        group: ${{ fromJSON(inputs.suite == 'cli-startup' && '["cli"]' || contains(fromJSON('["npm-git", "pty", "vcs", "shell-powershell", "runtime-boundaries"]'), inputs.suite) && '["core"]' || inputs.suite == 'app-config' && '["app"]' || (github.repository == 'caniko/opencode' && '["core", "cli", "remaining"]' || '["all"]')) }}
        settings:
          - name: linux
            host: ${{ github.repository == 'caniko/opencode' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
          - name: windows
            host: ${{ github.repository == 'caniko/opencode' && 'windows-2025' || 'blacksmith-4vcpu-windows-2025' }}
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Provision Ripgrep for offline runtime tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in
            Linux) platform=x86_64-unknown-linux-musl; extension=tar.gz ;;
            Windows) platform=x86_64-pc-windows-msvc; extension=zip ;;
          esac
          directory="$RUNNER_TEMP/ripgrep-15.1.0"
          mkdir -p "$directory"
          archive="ripgrep-15.1.0-$platform.$extension"
          gh release download 15.1.0 --repo BurntSushi/ripgrep --pattern "$archive" --dir "$directory"
          if [ "$RUNNER_OS" = Linux ]; then
            tar -xzf "$directory/$archive" -C "$directory"
          else
            unzip -q "$directory/$archive" -d "$directory"
          fi
          echo "$directory/ripgrep-15.1.0-$platform" >> "$GITHUB_PATH"

      - name: Verify Ripgrep
        run: rg --version

      - name: Test Effect simplification rules
        if: runner.os == 'Linux' && (matrix.group == 'all' || matrix.group == 'remaining')
        run: bun run test:effect-simplification-rules

      - name: Check Effect simplifications
        if: runner.os == 'Linux' && (matrix.group == 'all' || matrix.group == 'remaining')
        run: bun run lint:effect-simplifications

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          if [ "$OPENCODE_TEST_GROUP" = core ]; then
            directory="$GITHUB_WORKSPACE/test-results/npm-runtime"
            mkdir -p "$directory"
            if [ "$RUNNER_OS" = Windows ]; then directory="$(cygpath -m "$directory")"; fi
            export GIT_TRACE2_EVENT="$directory/git-trace.jsonl"
          fi
          if [ "$DIAGNOSTIC_SUITE" = cli-startup ]; then
            export OPENCODE_TEST_STARTUP_TRACE=1
            directory="$GITHUB_WORKSPACE/test-results/startup/children"
            mkdir -p "$directory"
            if [ "$RUNNER_OS" = Windows ]; then directory="$(cygpath -m "$directory")"; fi
            export OPENCODE_TEST_STARTUP_PROFILE_DIR="$directory"
            echo "Lifecycle child preload: $OPENCODE_TEST_STARTUP_PRELOAD"
            GITHUB_ACTIONS=false bun run --cwd packages/cli test ./test/service.test.ts ./test/standalone.test.ts ./test/acp/initialize-auth.subprocess.test.ts ./test/acp/config-options.subprocess.test.ts
            exit $?
          fi
          if [ "$DIAGNOSTIC_SUITE" = npm-git ]; then
            GIT_TRACE=1 GIT_TRACE_PERFORMANCE=1 GITHUB_ACTIONS=false bun run --cwd packages/core test ./test/npm.test.ts
            exit $?
          fi
          if [ "$DIAGNOSTIC_SUITE" = pty ]; then
            GITHUB_ACTIONS=false bun run --cwd packages/core test ./test/pty/pty-windows.test.ts
            exit $?
          fi
          if [ "$DIAGNOSTIC_SUITE" = app-config ]; then
            cd packages/app
            GITHUB_ACTIONS=false bun test --conditions=browser --preload ./happydom.ts ./test-browser/playwright-config.test.ts
            exit $?
          fi
          if [ "$DIAGNOSTIC_SUITE" = vcs ]; then
            GIT_TRACE=1 GIT_TRACE_PERFORMANCE=1 GITHUB_ACTIONS=false bun run --cwd packages/core test ./test/vcs.test.ts
            exit $?
          fi
          if [ "$DIAGNOSTIC_SUITE" = shell-powershell ]; then
            pwsh --version
            GITHUB_ACTIONS=false bun run --cwd packages/core test ./test/tool-shell.test.ts --test-name-pattern PowerShell
            exit $?
          fi
          if [ "$DIAGNOSTIC_SUITE" = runtime-boundaries ]; then
            export OPENCODE_PRINT_LOGS=1 OPENCODE_LOG_LEVEL=DEBUG
            core=0
            tui=0
            GITHUB_ACTIONS=false bun run --cwd packages/core test ./test/session-create.test.ts ./test/pty/pty-windows.test.ts || core=$?
            GITHUB_ACTIONS=false bun run --cwd packages/tui test ./test/app-lifecycle.test.tsx ./test/command-selection.test.tsx || tui=$?
            if [ "$core" -ne 0 ] || [ "$tui" -ne 0 ]; then exit 1; fi
            exit 0
          fi
          # Core spawns shells and CLI election tests spawn ten service contenders.
          # Keep fork package execution serial so their lifecycle deadlines measure the service.
          filters=()
          case "$OPENCODE_TEST_GROUP" in
            core) filters=(--filter=@opencode/core) ;;
            cli) filters=(--filter=@opencode/cli) ;;
            remaining) filters=(--filter='!@opencode/core' --filter='!@opencode/cli') ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GITHUB_ACTIONS=false bun turbo test "${filters[@]}" --concurrency="$OPENCODE_TEST_CONCURRENCY"
            exit 0
          fi
          GITHUB_ACTIONS=false bun turbo test --affected "${filters[@]}" --concurrency="$OPENCODE_TEST_CONCURRENCY"
        env:
          DIAGNOSTIC_SUITE: ${{ inputs.suite }}
          OPENCODE_TEST_CONCURRENCY: ${{ github.repository == 'caniko/opencode' && '1' || '3' }}
          OPENCODE_TEST_GROUP: ${{ matrix.group }}
          OPENCODE_TEST_STARTUP_TRACE: ${{ matrix.group == 'cli' && '1' || '' }}
          OPENCODE_TEST_STARTUP_PRELOAD: ${{ inputs.suite == 'cli-startup' && inputs.startup_preload || 'configured' }}
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Profile npm runtime imports
        if: always() && inputs.suite == 'npm-git'
        timeout-minutes: 2
        working-directory: packages/util
        run: |
          directory="$GITHUB_WORKSPACE/test-results/npm-runtime"
          if [ "$RUNNER_OS" = Windows ]; then directory="$(cygpath -m "$directory")"; fi
          bun --cpu-prof --cpu-prof-md --cpu-prof-name=npm-import --cpu-prof-dir="$directory" \
            -e 'const started = performance.now(); await import("@npmcli/arborist"); console.log(JSON.stringify({phase: "arborist-import", elapsed: performance.now() - started}))'

      - name: Upload Core npm runtime evidence
        if: always() && matrix.group == 'core'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-runtime-${{ matrix.settings.name }}
          path: test-results/npm-runtime
          if-no-files-found: error
          retention-days: 14

      - name: Profile headless startup imports
        if: always() && inputs.suite == 'cli-startup'
        timeout-minutes: 2
        run: |
          directory="$GITHUB_WORKSPACE/test-results/startup"
          mkdir -p "$directory"
          bun run --cwd packages/cli --cpu-prof --cpu-prof-dir "$directory" --cpu-prof-name help.cpuprofile src/index.ts --help > "$directory/help.txt"
          bun run --cwd packages/cli --config="$GITHUB_WORKSPACE/bunfig.toml" --cpu-prof --cpu-prof-dir "$directory" --cpu-prof-name help-no-preload.cpuprofile src/index.ts --help > "$directory/help-no-preload.txt"
          diff -u "$directory/help.txt" "$directory/help-no-preload.txt"

      - name: Profile server application imports
        if: always() && inputs.suite == 'cli-startup'
        timeout-minutes: 2
        env:
          GITHUB_ACTIONS: "false"
        run: |
          directory="$GITHUB_WORKSPACE/test-results/startup"
          mkdir -p "$directory"
          status=0
          bun run --cwd packages/cli --cpu-prof --cpu-prof-dir "$directory" --cpu-prof-name routes.cpuprofile ../server/script/profile-startup.ts > "$directory/routes.txt" 2>&1 || status=$?
          bun run --cwd packages/cli --config="$GITHUB_WORKSPACE/bunfig.toml" --cpu-prof --cpu-prof-dir "$directory" --cpu-prof-name routes-no-preload.cpuprofile ../server/script/profile-startup.ts > "$directory/routes-no-preload.txt" 2>&1 || status=$?
          cat "$directory/routes.txt" "$directory/routes-no-preload.txt"
          exit "$status"

      - name: Upload startup profiles
        if: always() && inputs.suite == 'cli-startup'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: startup-profiles-${{ matrix.settings.name }}
          path: test-results/startup
          if-no-files-found: error
          retention-days: 14

      - name: Verify published codemode package
        if: runner.os == 'Linux' && (matrix.group == 'all' || matrix.group == 'remaining')
        working-directory: packages/codemode
        run: bun run script/publish.ts --dry-run

      - name: Verify packed workerd SDK
        if: runner.os == 'Linux' && (matrix.group == 'all' || matrix.group == 'remaining')
        timeout-minutes: 15
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun turbo verify:package --filter=@opencode/sdk
            exit 0
          fi
          bun turbo verify:package --affected --filter=@opencode/sdk
        env:
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('{0}^1', github.sha) || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}

      - name: Verify compiled service lifecycle
        if: always() && (matrix.group == 'all' || matrix.group == 'remaining')
        timeout-minutes: 10
        working-directory: packages/cli
        env:
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
        run: |
          bun run script/build.ts --single --skip-install
          bun run script/service-smoke.ts

      - name: Setup Node build runtime
        if: always() && (matrix.group == 'all' || matrix.group == 'remaining')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26.4.0"

      - name: Verify Node build
        if: always() && (matrix.group == 'all' || matrix.group == 'remaining')
        timeout-minutes: 15
        working-directory: packages/cli
        env:
          NODE_OPTIONS: ${{ runner.os == 'Windows' && '--max-old-space-size=4096' || '' }}
        run: |
          bun run script/build-node.ts --single --skip-install --outdir=dist/node
          bun run script/service-smoke.ts --node

      - name: Check generated client
        if: runner.os == 'Linux' && (matrix.group == 'all' || matrix.group == 'remaining')
        working-directory: packages/client
        run: bun run check:generated

      - name: Check generated documentation
        if: runner.os == 'Linux' && (matrix.group == 'all' || matrix.group == 'remaining')
        working-directory: services/www
        run: bun run check:generated

  e2e:
    name: e2e (${{ matrix.settings.name }})
    needs: affected
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        settings:
          - name: linux
            host: ${{ github.repository == 'caniko/opencode' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
          - name: windows
            host: ${{ github.repository == 'caniko/opencode' && 'windows-2025' || 'blacksmith-4vcpu-windows-2025' }}
    runs-on: ${{ matrix.settings.host }}
    env:
      E2E_ENABLED: ${{ needs.affected.outputs.app == 'true' && github.ref_name != 'v2' && github.head_ref != 'v2' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        if: env.E2E_ENABLED == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        if: env.E2E_ENABLED == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        if: env.E2E_ENABLED == 'true'
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        if: env.E2E_ENABLED == 'true'
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: env.E2E_ENABLED == 'true'
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: env.E2E_ENABLED == 'true' && runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: env.E2E_ENABLED == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests against production build
        if: env.E2E_ENABLED == 'true'
        run: |
          if [ "$DIAGNOSTIC_SUITE" = timeline-history ]; then
            bun run --cwd packages/app test:e2e:built e2e/regression/timeline-history.spec.ts --trace on --repeat-each=3 --retries=0 --workers=1
          elif [ "$DIAGNOSTIC_SUITE" = timeline-benchmark ]; then
            directory="$GITHUB_WORKSPACE/test-results/timeline-benchmark"
            mkdir -p "$directory"
            OPENCODE_PERFORMANCE_TRACE_DIR="$directory" OPENCODE_PERFORMANCE_RUN_ID="$GITHUB_SHA-$RUNNER_OS" \
              bun run --cwd packages/app test:e2e:built --config e2e/performance/playwright.config.ts \
              timeline/session-timeline-benchmark.spec.ts --grep 'streams assistant text without remounting or oscillating' \
              --workers=1 --retries=0 | tee "$directory/benchmark.log"
          elif [ "$DIAGNOSTIC_SUITE" = composer ]; then
            bun run --cwd packages/app test:e2e:built e2e/regression/composer.spec.ts --trace on
          else
            bun run --cwd packages/app test:e2e:built
          fi
        env:
          CI: true
          DIAGNOSTIC_SUITE: ${{ inputs.suite }}
        timeout-minutes: 30

      - name: Verify service worker precaching and upgrades
        if: env.E2E_ENABLED == 'true' && !contains(fromJSON('["timeline-history", "timeline-benchmark", "composer"]'), inputs.suite)
        working-directory: packages/app
        run: bunx playwright test --config e2e/service-worker/playwright.config.ts
        timeout-minutes: 5

      - name: Run session UI component tests
        if: ${{ !cancelled() && env.E2E_ENABLED == 'true' && !contains(fromJSON('["timeline-history", "timeline-benchmark", "composer"]'), inputs.suite) }}
        run: bun --cwd packages/session-ui test:components
        env:
          CI: true
        timeout-minutes: 15

      - name: Upload Playwright artifacts
        if: always() && env.E2E_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
            packages/session-ui/component-tests/test-results
            packages/session-ui/component-tests/playwright-report
            test-results/timeline-benchmark
